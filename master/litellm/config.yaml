# Models are not listed here: the fleet controller adds/removes them through
# LiteLLM's model API (stored in Postgres) whenever roles or node health change.
model_list: []

router_settings:
  num_retries: 1
  default_max_parallel_requests: 1   # small nodes hold one model at a time

litellm_settings:
  drop_params: true
  turn_off_message_logging: true   # don't persist prompts/code

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  disable_spend_logs: true
